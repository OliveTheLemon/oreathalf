name: Production smoke checks

on:
  deployment_status:
  schedule:
    # 09:23 KST daily; avoid the top of the hour when scheduled runs are busiest.
    - cron: "23 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-smoke
  cancel-in-progress: false

jobs:
  smoke:
    name: Check production pages and core features
    if: >-
      github.event_name != 'deployment_status' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment.production_environment == true)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      CI: "true"
      PLAYWRIGHT_BASE_URL: https://www.oreathalf.com

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run production smoke suite
        run: npm run test:e2e

      - name: Write failure summary
        if: failure()
        run: |
          {
            echo "## Production smoke checks failed"
            echo
            echo "Target: $PLAYWRIGHT_BASE_URL"
            echo "Review the failed Playwright step and download the `playwright-report` artifact for details."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: production-smoke-report-${{ github.run_number }}
          path: |
            web/playwright-report/
            web/test-results/
          if-no-files-found: ignore
          retention-days: 14
